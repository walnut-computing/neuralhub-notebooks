[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "neuralhub-sdk"
version = "0.3.0"
description = "Download NeuralHub neuron recipes and steer local Transformers models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
transformers = ["torch>=2.4", "transformers>=5.21,<5.22", "accelerate>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/neuralhub"]
